<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BibScan Live</title>
<style>
  :root {
    --bg-image: url("biibbibcheck-bg.jpg");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body {
    background:
      linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
      var(--bg-image);
    background-size: cover;
    background-position: center;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  #stage {
    width: 100%;
    padding: 4vh 4vw;
    transition: opacity 0.4s ease;
  }
  #stage.fade { opacity: 0; }
  .bib {
    font-size: clamp(6.4rem, 17.6vw, 19.2rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .name {
    font-size: clamp(2.5rem, 6vw, 6rem);
    font-weight: 600;
    margin-top: 2vh;
    text-transform: uppercase;
  }
  .category {
    font-size: clamp(1.2rem, 3vw, 3rem);
    font-weight: 400;
    margin-top: 1.5vh;
    opacity: 0.85;
  }
  .idle {
    font-size: clamp(2.25rem, 6vw, 4.5rem);
    opacity: 0.6;
  }
  #countdown {
    position: fixed;
    bottom: 2vh;
    right: 2vw;
    font-size: clamp(3rem, 6vw, 6rem);
    font-weight: 700;
    line-height: 1;
    opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }
  #countdown.paused { color: #ffcc00; opacity: 0.85; }
  #status {
    position: fixed;
    top: 2vh;
    left: 2vw;
    font-size: 0.9rem;
    opacity: 0.4;
  }
  #help {
    position: fixed;
    bottom: 2vh;
    left: 2vw;
    font-size: 0.85rem;
    opacity: 0.35;
  }
  /* Big status banner (PAUSED / POLLING OFF) */
  #banner {
    position: fixed;
    top: 2vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1vw;
    pointer-events: none;
    z-index: 5;
  }
  .badge {
    padding: 0.6vh 1.6vw;
    border-radius: 999px;
    font-size: clamp(1rem, 2vw, 1.6rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    background: rgba(0,0,0,0.55);
    border: 2px solid #fff;
    opacity: 0.5;
  }
  .badge.warn { background: #ffcc00; color: #1a1a1a; border-color: #ffcc00; }
  .badge.off  { background: #e35747; color: #fff;     border-color: #e35747; }
  /* Tap zones (invisible) */
  .zone {
    position: fixed;
    top: 0; bottom: 0;
    width: 33.33vw;
    z-index: 2;
    background: transparent;
  }
  #zoneLeft   { left: 0; }
  #zoneCenter { left: 33.33vw; }
  #zoneRight  { right: 0; }
  /* On-screen control bar */
  #controls {
    position: fixed;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1.2vw;
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  #controls.hidden { opacity: 0; pointer-events: none; }
  .ctrl {
    width: clamp(56px, 8vw, 96px);
    height: clamp(56px, 8vw, 96px);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(1.5rem, 3vw, 2.4rem);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl:active { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <div id="stage"><div class="idle">Hello, are you ready to race?</div></div>
  <div id="status"></div>
  <div id="countdown"></div>
  <div id="banner"></div>
  <div class="zone" id="zoneLeft"></div>
  <div class="zone" id="zoneCenter"></div>
  <div class="zone" id="zoneRight"></div>
  <div id="controls">
    <button class="ctrl" id="btnPrev" title="Previous">⏮</button>
    <button class="ctrl" id="btnPause" title="Pause/Resume">⏸</button>
    <button class="ctrl" id="btnNext" title="Next">⏭</button>
    <button class="ctrl" id="btnPoll" title="Polling on/off">⏻</button>
  </div>
  <div id="help">Tap left/right to skip · center to pause · long-press to toggle polling &nbsp;·&nbsp; keys: Space ← → P</div>

<script>
(() => {
  // === CONFIG ===
  // After deploying worker.js to Cloudflare, paste its URL here:
  const PROXY_URL = "https://bib-proxy.yongshenat.workers.dev";
  const POLL_FAST_MS = 2000;        // active polling speed
  const POLL_SLOW_MS = 10000;       // idle polling speed
  const IDLE_THRESHOLD = 10;        // polls with no new data before slowing
  const DISPLAY_MS = 5000;
  const SEEN_KEY = "bibscan.seen.v1";
  // ==============

  const stage = document.getElementById("stage");
  const status = document.getElementById("status");
  const countdownEl = document.getElementById("countdown");

  const queue = [];
  const history = [];          // entries already shown (for ← previous)
  let historyIdx = -1;          // -1 = at "live"; 0..n-1 = viewing past entry
  const seen = new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"));
  let current = null;
  let paused = false;
  let remaining = 0;            // seconds left on current entry
  let tickTimer = null;

  const saveSeen = () => {
    // Cap to last 5000 to keep localStorage tidy
    const arr = [...seen].slice(-5000);
    localStorage.setItem(SEEN_KEY, JSON.stringify(arr));
  };

  const flatten = (row) => {
    const o = {};
    for (const cell of row) o[cell.fieldName] = cell.fieldValue;
    return {
      bib: o.memberNo || "",
      name: o.cnName || "",
      category: o.categoryName || "",
      passTime: o.passTime || "",
    };
  };

  const keyOf = (r) => `${r.bib}@${r.passTime}`;

  let idleStreak = 0;
  let pollTimer = null;
  let pollingEnabled = true;

  async function poll() {
    if (!pollingEnabled) return;
    let added = 0;
    try {
      const res = await fetch(PROXY_URL, { method: "POST" });
      const json = await res.json();
      const rows = (json.obj && json.obj["1_1_1"]) || [];
      // Iterate oldest→newest (portal returns newest first, so reverse)
      const flat = rows.map(flatten).reverse();
      for (const r of flat) {
        const k = keyOf(r);
        if (!r.bib || seen.has(k)) continue;
        seen.add(k);
        queue.push(r);
        added++;
      }
      saveSeen();
      idleStreak = added > 0 ? 0 : idleStreak + 1;
      const mode = idleStreak >= IDLE_THRESHOLD ? "idle" : "active";
      status.textContent = `connected · queue ${queue.length} · ${mode}`;
    } catch (e) {
      status.textContent = `error: ${e.message}`;
    } finally {
      if (pollingEnabled) {
        const next = idleStreak >= IDLE_THRESHOLD ? POLL_SLOW_MS : POLL_FAST_MS;
        pollTimer = setTimeout(poll, next);
      }
    }
  }

  function setPolling(on) {
    pollingEnabled = on;
    if (on) {
      poll();
    } else {
      clearTimeout(pollTimer);
      pollTimer = null;
      status.textContent = `polling stopped · queue ${queue.length}`;
    }
    refreshBanner();
  }

  const banner = document.getElementById("banner");
  function refreshBanner() {
    const parts = [];
    if (paused) parts.push(`<span class="badge warn">PAUSED</span>`);
    if (!pollingEnabled) parts.push(`<span class="badge off">POLLING: OFF</span>`);
    banner.innerHTML = parts.join("");
    document.getElementById("btnPause").textContent = paused ? "▶" : "⏸";
  }
  function togglePause() { paused = !paused; refreshBanner(); updateCountdown(); }

  function render(entry) {
    if (!entry) {
      stage.innerHTML = `<div class="idle">Hello, are you ready to race?</div>`;
      return;
    }
    const nameLine = entry.name && entry.name !== entry.bib
      ? `<div class="name">${escape(entry.name)}</div>` : "";
    stage.innerHTML = `
      <div class="bib">${escape(entry.bib)}</div>
      ${nameLine}
      <div class="category">${escape(entry.category)}</div>
    `;
  }

  function escape(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  function updateCountdown() {
    if (current == null) { countdownEl.textContent = ""; return; }
    const label = paused ? `⏸ ${remaining}` : `${remaining}`;
    countdownEl.textContent = label;
    countdownEl.classList.toggle("paused", paused);
  }

  function showEntry(entry, { resetTimer = true } = {}) {
    current = entry;
    stage.classList.add("fade");
    setTimeout(() => {
      render(current);
      stage.classList.remove("fade");
    }, 200);
    if (resetTimer) remaining = Math.ceil(DISPLAY_MS / 1000);
    updateCountdown();
  }

  function advance() {
    // If we were viewing history, step forward through it first.
    if (historyIdx >= 0 && historyIdx < history.length - 1) {
      historyIdx++;
      showEntry(history[historyIdx]);
      return;
    }
    // Otherwise pull from the live queue.
    historyIdx = -1;
    if (queue.length === 0) {
      current = null;
      render(null);
      countdownEl.textContent = "";
      return;
    }
    const next = queue.shift();
    history.push(next);
    if (history.length > 500) history.shift();
    showEntry(next);
  }

  function previous() {
    if (history.length === 0) return;
    if (historyIdx === -1) {
      // At "live". If idle (no current), the last history item hasn't been
      // re-shown, so go to it. Otherwise current === last history item, so
      // step back one further.
      historyIdx = current == null ? history.length - 1 : history.length - 2;
      if (historyIdx < 0) return;
    } else if (historyIdx > 0) {
      historyIdx--;
    } else {
      return;
    }
    showEntry(history[historyIdx]);
  }

  function tick() {
    if (paused || current == null) return;
    remaining--;
    if (remaining <= 0) {
      advance();
    } else {
      updateCountdown();
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); togglePause(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); advance(); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); previous(); }
    else if (e.code === "KeyP") { e.preventDefault(); setPolling(!pollingEnabled); }
  });

  // On-screen buttons
  document.getElementById("btnPrev").addEventListener("click", previous);
  document.getElementById("btnNext").addEventListener("click", advance);
  document.getElementById("btnPause").addEventListener("click", togglePause);
  document.getElementById("btnPoll").addEventListener("click", () => setPolling(!pollingEnabled));

  // Tap zones (with long-press detection for polling toggle)
  function bindZone(id, onTap) {
    const el = document.getElementById(id);
    let pressedAt = 0, longFired = false, timer = null;
    const start = () => {
      pressedAt = Date.now();
      longFired = false;
      timer = setTimeout(() => { longFired = true; setPolling(!pollingEnabled); }, 700);
    };
    const end = (e) => {
      clearTimeout(timer);
      if (!longFired && Date.now() - pressedAt < 700) onTap();
      e.preventDefault();
    };
    el.addEventListener("pointerdown", start);
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", () => clearTimeout(timer));
  }
  bindZone("zoneLeft", previous);
  bindZone("zoneCenter", togglePause);
  bindZone("zoneRight", advance);

  // Auto-hide control bar
  const controls = document.getElementById("controls");
  let hideTimer = null;
  function showControls() {
    controls.classList.remove("hidden");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => controls.classList.add("hidden"), 3000);
  }
  ["pointermove", "pointerdown", "keydown"].forEach(ev =>
    window.addEventListener(ev, showControls)
  );
  showControls();

  // Boot
  refreshBanner();
  poll().then(() => {
    advance();
    tickTimer = setInterval(tick, 1000);
  });
})();
</script>
</body>
</html>
