<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BibScan Live</title>
<style>
  :root {
    --bg-landscape: url("biibbibcheck-bg.jpg");
    --bg-portrait:  url("biibbibcheck-bg-portrait.jpg");
    --bg-image: var(--bg-landscape);
  }
  /* Auto: follow real screen orientation */
  @media (orientation: portrait) {
    :root { --bg-image: var(--bg-portrait); }
  }
  /* Manual overrides (body class beats media query) */
  body.force-landscape { --bg-image: var(--bg-landscape) !important; }
  body.force-portrait  { --bg-image: var(--bg-portrait)  !important; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body {
    background:
      linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
      var(--bg-image);
    background-size: cover;
    background-position: center;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  #stage {
    width: 100%;
    padding: 4vh 4vw;
    transition: opacity 0.4s ease;
  }
  #stage.fade { opacity: 0; }
  .bib      { font-size: clamp(6.4rem, 17.6vw, 19.2rem); font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
  .name     { font-size: clamp(2.5rem, 6vw, 6rem);  font-weight: 600; margin-top: 2vh; text-transform: uppercase; }
  .category { font-size: clamp(1.2rem, 3vw, 3rem);  font-weight: 400; margin-top: 1.5vh; opacity: 0.85; }
  .idle     { font-size: clamp(2.25rem, 6vw, 4.5rem); opacity: 0.6; }
  /* Portrait sizing — scale off height (vh) so text stays big on narrow screens */
  @media (orientation: portrait) {
    .bib      { font-size: clamp(6.4rem, 17.6vh, 19.2rem); }
    .name     { font-size: clamp(2.5rem, 6vh, 6rem); }
    .category { font-size: clamp(1.2rem, 3vh, 3rem); }
    .idle     { font-size: clamp(2.25rem, 6vh, 4.5rem); }
  }
  body.force-landscape .bib      { font-size: clamp(6.4rem, 17.6vw, 19.2rem) !important; }
  body.force-landscape .name     { font-size: clamp(2.5rem, 6vw, 6rem) !important; }
  body.force-landscape .category { font-size: clamp(1.2rem, 3vw, 3rem) !important; }
  body.force-landscape .idle     { font-size: clamp(2.25rem, 6vw, 4.5rem) !important; }
  body.force-portrait  .bib      { font-size: clamp(6.4rem, 17.6vh, 19.2rem) !important; }
  body.force-portrait  .name     { font-size: clamp(2.5rem, 6vh, 6rem) !important; }
  body.force-portrait  .category { font-size: clamp(1.2rem, 3vh, 3rem) !important; }
  body.force-portrait  .idle     { font-size: clamp(2.25rem, 6vh, 4.5rem) !important; }
  #countdown {
    position: fixed;
    bottom: 10vh;
    right: 2vw;
    font-size: clamp(3rem, 6vw, 6rem);
    font-weight: 700;
    line-height: 1;
    opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }
  #countdown.paused { color: #ffcc00; opacity: 0.85; }
  #status {
    position: fixed;
    top: 2vh;
    left: 2vw;
    font-size: 0.9rem;
    opacity: 0.4;
  }
  #help {
    position: fixed;
    bottom: 2vh;
    left: 2vw;
    font-size: 0.85rem;
    opacity: 0.35;
  }
  /* Big status banner (PAUSED / POLLING OFF) */
  #banner {
    position: fixed;
    top: 2vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1vw;
    pointer-events: none;
    z-index: 5;
  }
  .badge {
    padding: 0.6vh 1.6vw;
    border-radius: 999px;
    font-size: clamp(1rem, 2vw, 1.6rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    background: rgba(0,0,0,0.55);
    border: 2px solid #fff;
    opacity: 0.5;
  }
  .badge.warn { background: #ffcc00; color: #1a1a1a; border-color: #ffcc00; }
  .badge.off  { background: #e35747; color: #fff;     border-color: #e35747; }
  /* Tap zones (invisible) */
  .zone {
    position: fixed;
    top: 0; bottom: 0;
    width: 33.33vw;
    z-index: 2;
    background: transparent;
  }
  #zoneLeft   { left: 0; }
  #zoneCenter { left: 33.33vw; }
  #zoneRight  { right: 0; }
  /* On-screen control bar */
  #controls {
    position: fixed;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1.2vw;
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  #controls.hidden { opacity: 0; pointer-events: none; }
  .ctrl {
    width: clamp(56px, 8vw, 96px);
    height: clamp(56px, 8vw, 96px);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(1.5rem, 3vw, 2.4rem);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl:active { background: rgba(255,255,255,0.2); }
  /* Settings gear */
  #settingsBtn {
    position: fixed;
    bottom: 2vh;
    right: 2vw;
    width: clamp(44px, 5vw, 64px);
    height: clamp(44px, 5vw, 64px);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(1.2rem, 2vw, 1.8rem);
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.4s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #settingsBtn.hidden { opacity: 0; pointer-events: none; }
  /* Settings modal */
  #settingsModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #settingsModal.open { display: flex; }
  .modal-card {
    background: #1a1a2e;
    color: #fff;
    border-radius: 12px;
    padding: 4vh 5vw;
    min-width: min(420px, 90vw);
    text-align: left;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-card h2 { font-size: 1.5rem; margin-bottom: 2vh; }
  .modal-card label { display: block; font-size: 0.9rem; opacity: 0.8; margin-bottom: 0.4rem; margin-top: 1.4vh; }
  .modal-card input {
    width: 100%;
    padding: 0.9rem;
    font-size: 1.1rem;
    border-radius: 8px;
    border: 1px solid #444;
    background: #0f0f1e;
    color: #fff;
  }
  .modal-actions { display: flex; gap: 1rem; margin-top: 3vh; justify-content: flex-end; }
  .modal-actions button {
    padding: 0.8rem 1.6rem;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-save   { background: #2ecc71; color: #1a1a1a; }
  .btn-cancel { background: #444;    color: #fff; }
</style>
</head>
<body>
  <div id="stage"><div class="idle">Hello, are you ready to race?</div></div>
  <div id="status"></div>
  <div id="countdown"></div>
  <div id="banner"></div>
  <div class="zone" id="zoneLeft"></div>
  <div class="zone" id="zoneCenter"></div>
  <div class="zone" id="zoneRight"></div>
  <div id="controls">
    <button class="ctrl" id="btnPrev" title="Previous">⏮</button>
    <button class="ctrl" id="btnPause" title="Pause/Resume">⏸</button>
    <button class="ctrl" id="btnNext" title="Next">⏭</button>
    <button class="ctrl" id="btnPoll" title="Polling on/off">⏻</button>
  </div>
  <div id="help">Tap left/right to skip · center to pause · long-press to toggle polling &nbsp;·&nbsp; keys: Space ← → P</div>
  <button id="settingsBtn" title="Settings">⚙</button>
  <div id="settingsModal">
    <div class="modal-card">
      <h2>Event Settings</h2>
      <label for="cfgRaceId">Race ID</label>
      <input id="cfgRaceId" type="text" inputmode="numeric" />
      <label for="cfgPortalId">Portal ID</label>
      <input id="cfgPortalId" type="text" inputmode="numeric" />
      <label for="cfgLayout">Layout</label>
      <select id="cfgLayout" style="width:100%;padding:0.9rem;font-size:1.1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#fff;">
        <option value="auto">Auto (follow screen)</option>
        <option value="landscape">Force Landscape</option>
        <option value="portrait">Force Portrait</option>
      </select>
      <div class="modal-actions">
        <button class="btn-cancel" id="cfgCancel">Cancel</button>
        <button class="btn-save" id="cfgSave">Save</button>
      </div>
    </div>
  </div>

<script>
(() => {
  // === CONFIG ===
  // After deploying worker.js to Cloudflare, paste its URL here:
  const PROXY_URL = "https://bib-proxy.yongshenat.workers.dev";
  const POLL_FAST_MS = 2000;        // active polling speed
  const POLL_SLOW_MS = 10000;       // idle polling speed
  const IDLE_THRESHOLD = 10;        // polls with no new data before slowing
  const DISPLAY_MS = 1000;
  const CFG_KEY = "bibscan.cfg.v1";
  const DEFAULT_CFG = { raceId: "105191", portalId: "1", layout: "auto" };
  // ==============

  function loadCfg() {
    try {
      const raw = JSON.parse(localStorage.getItem(CFG_KEY) || "null");
      return Object.assign({}, DEFAULT_CFG, raw || {});
    } catch { return { ...DEFAULT_CFG }; }
  }
  function saveCfg(c) { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
  let cfg = loadCfg();
  const seenKey = () => `bibscan.seen.${cfg.raceId}.${cfg.portalId}`;
  function applyLayout() {
    document.body.classList.remove("force-landscape", "force-portrait");
    if (cfg.layout === "landscape") document.body.classList.add("force-landscape");
    else if (cfg.layout === "portrait") document.body.classList.add("force-portrait");
  }

  const stage = document.getElementById("stage");
  const status = document.getElementById("status");
  const countdownEl = document.getElementById("countdown");

  const queue = [];
  const history = [];          // entries already shown (for ← previous)
  let historyIdx = -1;          // -1 = at "live"; 0..n-1 = viewing past entry
  let seen = new Set(JSON.parse(localStorage.getItem(seenKey()) || "[]"));
  let current = null;
  let paused = false;
  let remaining = 0;            // seconds left on current entry
  let tickTimer = null;

  const saveSeen = () => {
    // Cap to last 5000 to keep localStorage tidy
    const arr = [...seen].slice(-5000);
    localStorage.setItem(seenKey(), JSON.stringify(arr));
  };

  const flatten = (row) => {
    const o = {};
    for (const cell of row) o[cell.fieldName] = cell.fieldValue;
    return {
      bib: o.memberNo || "",
      name: o.cnName || "",
      category: o.categoryName || "",
      passTime: o.passTime || "",
    };
  };

  const keyOf = (r) => `${r.bib}@${r.passTime}`;

  let idleStreak = 0;
  let pollTimer = null;
  let pollingEnabled = true;

  async function poll() {
    if (!pollingEnabled) return;
    let added = 0;
    try {
      const body = `partner=000001&raceId=${encodeURIComponent(cfg.raceId)}&portalId=${encodeURIComponent(cfg.portalId)}`;
      const res = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      const json = await res.json();
      // Portal returns data under a key like "1_1_1" or "2_1_1" depending on portalId.
      // Grab whatever key is there rather than hardcoding portal 1.
      const objKey = json.obj ? Object.keys(json.obj)[0] : null;
      const rows = (objKey && json.obj[objKey]) || [];
      // Iterate oldest→newest (portal returns newest first, so reverse)
      const flat = rows.map(flatten).reverse();
      for (const r of flat) {
        const k = keyOf(r);
        if (!r.bib || seen.has(k)) continue;
        seen.add(k);
        queue.push(r);
        added++;
      }
      saveSeen();
      idleStreak = added > 0 ? 0 : idleStreak + 1;
      const mode = idleStreak >= IDLE_THRESHOLD ? "idle" : "active";
      status.textContent = `connected · queue ${queue.length} · ${mode}`;
    } catch (e) {
      status.textContent = `error: ${e.message}`;
    } finally {
      if (pollingEnabled) {
        const next = idleStreak >= IDLE_THRESHOLD ? POLL_SLOW_MS : POLL_FAST_MS;
        pollTimer = setTimeout(poll, next);
      }
    }
  }

  function setPolling(on) {
    pollingEnabled = on;
    if (on) {
      poll();
    } else {
      clearTimeout(pollTimer);
      pollTimer = null;
      status.textContent = `polling stopped · queue ${queue.length}`;
    }
    refreshBanner();
  }

  const banner = document.getElementById("banner");
  function refreshBanner() {
    const parts = [];
    if (paused) parts.push(`<span class="badge warn">PAUSED</span>`);
    if (!pollingEnabled) parts.push(`<span class="badge off">POLLING: OFF</span>`);
    banner.innerHTML = parts.join("");
    document.getElementById("btnPause").textContent = paused ? "▶" : "⏸";
  }
  function togglePause() { paused = !paused; refreshBanner(); updateCountdown(); }

  function render(entry) {
    if (!entry) {
      stage.innerHTML = `<div class="idle">Hello, are you ready to race?</div>`;
      return;
    }
    const nameLine = entry.name && entry.name !== entry.bib
      ? `<div class="name">${escape(entry.name)}</div>` : "";
    stage.innerHTML = `
      <div class="bib">${escape(entry.bib)}</div>
      ${nameLine}
      <div class="category">${escape(entry.category)}</div>
    `;
  }

  function escape(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  function updateCountdown() {
    if (current == null) { countdownEl.textContent = ""; return; }
    const label = paused ? `⏸ ${remaining}` : `${remaining}`;
    countdownEl.textContent = label;
    countdownEl.classList.toggle("paused", paused);
  }

  function showEntry(entry, { resetTimer = true } = {}) {
    current = entry;
    stage.classList.add("fade");
    setTimeout(() => {
      render(current);
      stage.classList.remove("fade");
    }, 200);
    if (resetTimer) remaining = Math.ceil(DISPLAY_MS / 1000);
    updateCountdown();
  }

  function advance() {
    // If we were viewing history, step forward through it first.
    if (historyIdx >= 0 && historyIdx < history.length - 1) {
      historyIdx++;
      showEntry(history[historyIdx]);
      return;
    }
    // Otherwise pull from the live queue.
    historyIdx = -1;
    if (queue.length === 0) {
      current = null;
      render(null);
      countdownEl.textContent = "";
      return;
    }
    const next = queue.shift();
    history.push(next);
    if (history.length > 500) history.shift();
    showEntry(next);
  }

  function previous() {
    if (history.length === 0) return;
    if (historyIdx === -1) {
      // At "live". If idle (no current), the last history item hasn't been
      // re-shown, so go to it. Otherwise current === last history item, so
      // step back one further.
      historyIdx = current == null ? history.length - 1 : history.length - 2;
      if (historyIdx < 0) return;
    } else if (historyIdx > 0) {
      historyIdx--;
    } else {
      return;
    }
    showEntry(history[historyIdx]);
  }

  function tick() {
    if (paused) return;
    if (current == null) {
      // Idle — try to pick up newly-arrived entries.
      if (queue.length > 0) advance();
      return;
    }
    remaining--;
    if (remaining <= 0) {
      advance();
    } else {
      updateCountdown();
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); togglePause(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); advance(); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); previous(); }
    else if (e.code === "KeyP") { e.preventDefault(); setPolling(!pollingEnabled); }
  });

  // On-screen buttons
  document.getElementById("btnPrev").addEventListener("click", previous);
  document.getElementById("btnNext").addEventListener("click", advance);
  document.getElementById("btnPause").addEventListener("click", togglePause);
  document.getElementById("btnPoll").addEventListener("click", () => setPolling(!pollingEnabled));

  // Tap zones (with long-press detection for polling toggle)
  function bindZone(id, onTap) {
    const el = document.getElementById(id);
    let pressedAt = 0, longFired = false, timer = null;
    const start = () => {
      pressedAt = Date.now();
      longFired = false;
      timer = setTimeout(() => { longFired = true; setPolling(!pollingEnabled); }, 700);
    };
    const end = (e) => {
      clearTimeout(timer);
      if (!longFired && Date.now() - pressedAt < 700) onTap();
      e.preventDefault();
    };
    el.addEventListener("pointerdown", start);
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", () => clearTimeout(timer));
  }
  bindZone("zoneLeft", previous);
  bindZone("zoneCenter", togglePause);
  bindZone("zoneRight", advance);

  // Auto-hide control bar + settings gear
  const controls = document.getElementById("controls");
  const settingsBtn = document.getElementById("settingsBtn");
  let hideTimer = null;
  function showControls() {
    controls.classList.remove("hidden");
    settingsBtn.classList.remove("hidden");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      controls.classList.add("hidden");
      settingsBtn.classList.add("hidden");
    }, 3000);
  }
  ["pointermove", "pointerdown", "keydown"].forEach(ev =>
    window.addEventListener(ev, showControls)
  );
  showControls();

  // Settings modal
  const modal = document.getElementById("settingsModal");
  const cfgRaceId = document.getElementById("cfgRaceId");
  const cfgPortalId = document.getElementById("cfgPortalId");
  const cfgLayout = document.getElementById("cfgLayout");
  function openSettings() {
    cfgRaceId.value = cfg.raceId;
    cfgPortalId.value = cfg.portalId;
    cfgLayout.value = cfg.layout || "auto";
    modal.classList.add("open");
  }
  function closeSettings() { modal.classList.remove("open"); }
  settingsBtn.addEventListener("click", openSettings);
  document.getElementById("cfgCancel").addEventListener("click", closeSettings);
  document.getElementById("cfgSave").addEventListener("click", () => {
    const newCfg = {
      raceId: cfgRaceId.value.trim() || DEFAULT_CFG.raceId,
      portalId: cfgPortalId.value.trim() || DEFAULT_CFG.portalId,
      layout: cfgLayout.value || "auto",
    };
    const eventChanged = newCfg.raceId !== cfg.raceId || newCfg.portalId !== cfg.portalId;
    cfg = newCfg;
    saveCfg(cfg);
    applyLayout();
    if (eventChanged) {
      // Different event — reset queue, history, and seen-set (scoped per event).
      queue.length = 0;
      history.length = 0;
      historyIdx = -1;
      current = null;
      render(null);
      seen = new Set(JSON.parse(localStorage.getItem(seenKey()) || "[]"));
      // Restart polling immediately with new config.
      clearTimeout(pollTimer);
      if (pollingEnabled) poll();
    }
    closeSettings();
  });
  modal.addEventListener("click", (e) => { if (e.target === modal) closeSettings(); });

  // Boot
  applyLayout();
  refreshBanner();
  poll().then(() => {
    advance();
    tickTimer = setInterval(tick, 1000);
  });
})();
</script>
</body>
</html>
