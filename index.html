<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BibScan Live</title>
<style>
  :root {
    --bg-image: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body {
    background: var(--bg-image);
    background-size: cover;
    background-position: center;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  #stage {
    width: 100%;
    padding: 4vh 4vw;
    transition: opacity 0.4s ease;
  }
  #stage.fade { opacity: 0; }
  .bib {
    font-size: clamp(8rem, 22vw, 24rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .name {
    font-size: clamp(2.5rem, 6vw, 6rem);
    font-weight: 600;
    margin-top: 2vh;
    text-transform: uppercase;
  }
  .category {
    font-size: clamp(1.2rem, 3vw, 3rem);
    font-weight: 400;
    margin-top: 1.5vh;
    opacity: 0.85;
  }
  .idle {
    font-size: clamp(1.5rem, 4vw, 3rem);
    opacity: 0.6;
  }
  #countdown {
    position: fixed;
    bottom: 2vh;
    right: 2vw;
    font-size: 1.2rem;
    opacity: 0.4;
  }
  #status {
    position: fixed;
    top: 2vh;
    left: 2vw;
    font-size: 0.9rem;
    opacity: 0.4;
  }
</style>
</head>
<body>
  <div id="stage"><div class="idle">Waiting for runners…</div></div>
  <div id="status"></div>
  <div id="countdown"></div>

<script>
(() => {
  // === CONFIG ===
  // After deploying worker.js to Cloudflare, paste its URL here:
  const PROXY_URL = "https://bib-proxy.yongshenat.workers.dev";
  const POLL_MS = 2000;
  const DISPLAY_MS = 5000;
  const SEEN_KEY = "bibscan.seen.v1";
  // ==============

  const stage = document.getElementById("stage");
  const status = document.getElementById("status");
  const countdownEl = document.getElementById("countdown");

  const queue = [];
  const seen = new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"));
  let current = null;

  const saveSeen = () => {
    // Cap to last 5000 to keep localStorage tidy
    const arr = [...seen].slice(-5000);
    localStorage.setItem(SEEN_KEY, JSON.stringify(arr));
  };

  const flatten = (row) => {
    const o = {};
    for (const cell of row) o[cell.fieldName] = cell.fieldValue;
    return {
      bib: o.memberNo || "",
      name: o.cnName || "",
      category: o.categoryName || "",
      passTime: o.passTime || "",
    };
  };

  const keyOf = (r) => `${r.bib}@${r.passTime}`;

  async function poll() {
    try {
      const res = await fetch(PROXY_URL, { method: "POST" });
      const json = await res.json();
      status.textContent = `connected · queue ${queue.length}`;
      const rows = (json.obj && json.obj["1_1_1"]) || [];
      // Iterate oldest→newest (portal returns newest first, so reverse)
      const flat = rows.map(flatten).reverse();
      for (const r of flat) {
        const k = keyOf(r);
        if (!r.bib || seen.has(k)) continue;
        seen.add(k);
        queue.push(r);
      }
      saveSeen();
    } catch (e) {
      status.textContent = `error: ${e.message}`;
    }
  }

  function render(entry) {
    if (!entry) {
      stage.innerHTML = `<div class="idle">Waiting for runners…</div>`;
      return;
    }
    const nameLine = entry.name && entry.name !== entry.bib
      ? `<div class="name">${escape(entry.name)}</div>` : "";
    stage.innerHTML = `
      <div class="bib">${escape(entry.bib)}</div>
      ${nameLine}
      <div class="category">${escape(entry.category)}</div>
    `;
  }

  function escape(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  let countdownTimer = null;
  function showNext() {
    clearInterval(countdownTimer);
    if (queue.length === 0) {
      current = null;
      render(null);
      countdownEl.textContent = "";
      // Check again shortly
      setTimeout(showNext, 1000);
      return;
    }
    current = queue.shift();
    stage.classList.add("fade");
    setTimeout(() => {
      render(current);
      stage.classList.remove("fade");
    }, 200);

    let remaining = Math.ceil(DISPLAY_MS / 1000);
    countdownEl.textContent = `${remaining}s · queue ${queue.length}`;
    countdownTimer = setInterval(() => {
      remaining--;
      countdownEl.textContent = `${remaining}s · queue ${queue.length}`;
    }, 1000);
    setTimeout(showNext, DISPLAY_MS);
  }

  // Boot
  poll().then(() => {
    setInterval(poll, POLL_MS);
    showNext();
  });
})();
</script>
</body>
</html>
